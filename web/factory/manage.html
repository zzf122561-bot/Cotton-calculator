<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>加工厂管理 · 机采棉</title><link rel="stylesheet" href="./style.css"><script type="module" src="./manage.js"></script></head>
<body><main class="shell">
<header class="masthead"><div><span class="brand"><img src="./cotton-boll.png" alt="棉花"></span><h1>加工厂管理</h1></div><a href="./">返回计算页</a></header>
<p id="status" class="status" role="status" aria-live="polite">正在连接…</p>
<button id="connect-retry" class="secondary" hidden>重新连接</button>
<div id="management-heading" class="factory-strip" hidden><strong id="manager-name"></strong><button id="logout" class="secondary" hidden>退出后台</button></div>
<fieldset id="management-lock" class="management-lock">
<section id="login-panel" class="panel entry" hidden><h2>管理账号登录</h2><p>使用平台为您开通的账号和密码。</p><form id="login-form"><label for="username">管理账号</label><input id="username" autocomplete="username" maxlength="40" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button class="primary wide" id="login-button">登录后台</button></form></section>
<div id="management" hidden>
  <section class="panel"><label for="factory-select">选择管理项目</label><select id="factory-select"></select><p id="factory-info"></p><strong id="factory-code" class="code-display"></strong>
    <details id="new-factory" hidden><summary>开通一家加工厂</summary><form id="create-form" class="admin-grid"><div><label for="new-name">加工厂名称</label><input id="new-name" required maxlength="60"></div><div><label for="new-username">厂方管理账号</label><input id="new-username" required pattern="[A-Za-z0-9_.-]{3,40}" autocomplete="off"></div><div><label for="new-password">初始密码（至少 8 位）</label><input id="new-password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></div><div><label for="new-confirmation">再输入一次密码</label><input id="new-confirmation" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></div><div class="full actions"><button class="primary">创建加工厂</button></div></form></details>
  </section>
  <section id="permissions-panel" class="panel" hidden><h2>厂方资料与权限</h2><form id="permissions-form"><label for="edit-name">加工厂名称</label><input id="edit-name" maxlength="60" required><label class="check"><input id="factory-enabled" type="checkbox">启用加工厂服务</label><h3>允许厂方修改的参数</h3><div id="permission-fields" class="admin-grid"></div><label class="check"><input id="share-permission" type="checkbox">允许厂方编辑分享文案</label><div class="actions"><button class="primary">保存资料与权限</button><button id="rotate-code" type="button" class="secondary">更换厂码</button></div></form>
  <details><summary>重置厂方管理密码</summary><form id="reset-form" class="admin-grid"><div><label for="reset-password">新密码</label><input id="reset-password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><div><label for="reset-confirmation">确认新密码</label><input id="reset-confirmation" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><div class="full actions"><button class="secondary">重置并退出该厂旧登录</button></div></form></details></section>
  <section id="config-panel" class="panel" hidden><div class="section-heading"><h2 id="config-title">计算参数与分享文案</h2><button id="reload-config" class="secondary">重新载入</button></div><p id="config-version"></p><p>编辑后先看预览，再发布。发布后用于下一次测算，当前页面内已加入对比的结果保持原样。</p><div id="parameter-fields" class="admin-grid"></div>
    <h3>分享文案编辑</h3><p id="template-permission" class="help"></p><div id="template-editor"></div><button id="add-text" class="secondary">添加一段文字</button>
    <h3>报价预览</h3><pre id="config-preview" class="preview">正在生成预览…</pre><div class="actions"><button id="preview-config" class="secondary">更新预览</button><button id="publish-config" class="primary" disabled>发布配置</button></div>
  </section>
  <section id="contacts-panel" class="panel" hidden><div class="section-heading"><h2>收到的手机号</h2><span id="contact-count"></span></div><div class="actions"><button id="export-contacts" class="primary">一键导出手机号</button><button id="refresh-contacts" class="secondary">刷新名单</button></div><div id="contacts"></div></section>
  <section class="panel"><details><summary>修改我的管理密码</summary><form id="own-password-form" class="admin-grid"><div class="full"><label for="current-password">原密码</label><input id="current-password" type="password" autocomplete="current-password" required maxlength="128"></div><div><label for="own-new-password">新密码</label><input id="own-new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div><div><label for="own-confirmation">确认新密码</label><input id="own-confirmation" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div><div class="full actions"><button class="secondary">修改密码并重新登录</button></div></form></details></section>
</div>
</fieldset></main></body></html>
